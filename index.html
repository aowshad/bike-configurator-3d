<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bike Configurator 3D</title>
<meta name="description" content="Realistic 3D bike configurator: paint, parts and stickers, live in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Archivo+Black&family=Bebas+Neue&family=Permanent+Marker&family=Racing+Sans+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="app">
  <section class="stage" id="stage" aria-label="3D bike preview">
    <div class="brandmark">Gravity DH <span>Demo</span></div>
    <div class="hint" id="hint">Drag to rotate · Scroll to zoom · Click a part to edit it</div>
    <div class="loader" id="loader"><div class="box"><div id="loadTxt">Loading bike… 0%</div><div class="bar"><i id="loadBar"></i></div></div></div>
    <div class="partTip" id="partTip"></div>
    <div class="toolbar" role="toolbar" aria-label="View controls">
      <button class="tb" data-view="overview" title="Full view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V5a2 2 0 0 1 2-2h4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M9 21H5a2 2 0 0 1-2-2v-4"/></svg><span class="lbl">Full view</span></button>
      <button class="tb" data-view="side" title="Side view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16 9 8h6l3.5 8M9 8l3 8 3-8M8 6h3"/></svg><span class="lbl">Side</span></button>
      <button class="tb" id="spinBtn" title="Auto-rotate" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span class="lbl">Rotate</span></button>
      <span class="tbsep"></span>
      <button class="tb" id="shotBtn" title="Save image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="lbl">Image</span></button>
      <button class="tb" id="themeBtn" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    </div>
  </section>

  <aside class="panel" aria-label="Configure your bike">
    <div class="phead">
      <div class="eyebrow">Downhill · 200 mm travel · 29"</div>
      <div class="title">Gravity DH</div>
      <p class="desc">Paint, parts and stickers. Every change shows up live on the bike.</p>
    </div>
    <div class="plabel" style="padding-top:4px">Start from a look</div>
    <div class="presets" id="presets"></div>
    <div class="plabel">Customize</div>
    <div class="sections" id="sections"></div>
    <div class="foot">
      <div class="price"><span class="total" id="total">€4,499</span><span class="extra" id="extra"></span><span class="ship">Free shipping · Hand-built in 3–4 weeks</span></div>
      <div class="actions">
        <button class="btn" id="shareBtn" title="Copy a link to this build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span id="shareLbl">Share</span></button>
        <button class="btn primary" id="cartBtn">Add to cart</button>
      </div>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
